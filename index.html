<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFO Widebody Arrivals</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .filters {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            gap: 8px;
        }
        .filter-separator {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 8px;
        }
        .filter-btn, .type-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn:hover, .type-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .filter-btn.active, .type-btn.active {
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
        }
        .airport-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .airport-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .airport-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        .airport-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-color: transparent;
            color: #fff;
        }
        .custom-airport-input {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 90px;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.2s;
        }
        .custom-airport-input::placeholder {
            color: #666;
            text-transform: none;
        }
        .custom-airport-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.12);
        }
        .custom-airport-input.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-color: transparent;
        }
        .status-indicator {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 8px;
            vertical-align: middle;
        }
        .status-indicator.live {
            background: #22c55e;
            color: #000;
            animation: pulse-live 1.5s ease-in-out infinite;
        }
        .status-indicator.offline {
            background: #666;
            color: #fff;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            50% { opacity: 0.9; box-shadow: 0 0 12px 4px rgba(34, 197, 94, 0.5); }
        }
        .altitude {
            color: #22c55e;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        .flights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .flight-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .flight-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
        }
        .flight-card.live {
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        .flight-card.landed {
            opacity: 0.6;
        }
        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .flight-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .aircraft-type {
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .flight-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .detail {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .eta { color: #f472b6; }
        .origin { color: #a78bfa; }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .status-green { background: #22c55e; color: #000; }
        .status-yellow { background: #facc15; color: #000; }
        .status-red { background: #ef4444; color: #fff; }
        .status-gray { background: rgba(255,255,255,0.2); color: #888; }
        .no-flights {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }
        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: #fff;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-section {
            margin-bottom: 20px;
        }
        .modal-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .modal-item {
            display: flex;
            flex-direction: column;
        }
        .modal-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 3px;
        }
        .modal-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: #fff;
        }
        .modal-value.highlight {
            color: #00d4ff;
        }
        .modal-value.positive {
            color: #22c55e;
        }
        .modal-value.negative {
            color: #ef4444;
        }
        .modal-route {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .modal-route-airport {
            text-align: center;
        }
        .modal-route-code {
            font-size: 1.3rem;
            font-weight: bold;
            color: #a78bfa;
        }
        .modal-route-name {
            font-size: 0.75rem;
            color: #888;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .modal-route-arrow {
            flex: 1;
            text-align: center;
            color: #666;
            font-size: 1.2rem;
        }
        .modal-loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .modal-mini-map {
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }
        .flight-card.clickable {
            cursor: pointer;
        }
        .flight-card.clickable:active {
            transform: scale(0.98);
        }
        /* Map mode styles */
        .view-toggle {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .view-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .view-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .view-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
        }
        #map-container {
            display: none;
            height: 70vh;
            min-height: 400px;
            max-width: 1400px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #map-container.active {
            display: block;
        }
        #flights-container.hidden {
            display: none;
        }
        .plane-marker {
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .plane-marker.widebody {
            color: #00d4ff;
        }
        .plane-marker.narrowbody {
            color: #a78bfa;
        }
        .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            border-radius: 12px;
        }
        .leaflet-popup-tip {
            background: #16213e;
        }
        .leaflet-popup-content {
            margin: 12px;
        }
        .map-popup-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        .map-popup-detail {
            font-size: 0.85rem;
            color: #ccc;
            margin: 4px 0;
        }
        .map-popup-detail span {
            color: #fff;
            font-weight: 500;
        }
        .map-popup-btn {
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 10px;
            width: 100%;
        }
        .map-popup-btn:hover {
            opacity: 0.9;
        }
        .airport-marker {
            font-size: 20px;
        }
        /* Weather card styles */
        .weather-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            max-width: 600px;
            margin: 0 auto 20px;
            display: none;
        }
        .weather-card.active {
            display: block;
        }
        .weather-card.error {
            opacity: 0.5;
        }
        .weather-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .weather-icon {
            font-size: 1.5rem;
        }
        .weather-title {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .weather-description {
            color: #fff;
            font-size: 0.9rem;
            margin-left: auto;
        }
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .weather-item {
            text-align: center;
        }
        .weather-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #00d4ff;
        }
        .weather-value.good {
            color: #22c55e;
        }
        .weather-value.moderate {
            color: #facc15;
        }
        .weather-value.poor {
            color: #ef4444;
        }
        .weather-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mobile styles */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            h1 {
                font-size: 1.5rem;
                margin-bottom: 6px;
            }
            .subtitle {
                margin-bottom: 16px;
                font-size: 0.8rem;
            }
            .airport-selector {
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 16px;
            }
            .airport-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            .custom-airport-input {
                width: 80px;
                padding: 6px 10px;
                font-size: 0.85rem;
            }
            .stats {
                gap: 20px;
                margin-bottom: 16px;
            }
            .stat-value {
                font-size: 1.8rem;
            }
            .stat-label {
                font-size: 0.7rem;
            }
            .filters {
                flex-wrap: wrap;
                gap: 6px;
                margin-bottom: 12px;
            }
            .filter-group {
                gap: 6px;
            }
            .filter-separator {
                display: none;
            }
            .filter-btn, .type-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .refresh-info {
                margin-bottom: 12px;
                font-size: 0.75rem;
            }
            .flights-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .flight-card {
                padding: 14px;
                border-radius: 12px;
            }
            .flight-header {
                margin-bottom: 10px;
            }
            .flight-number {
                font-size: 1.25rem;
            }
            .aircraft-type {
                padding: 3px 10px;
                font-size: 0.75rem;
            }
            .flight-details {
                gap: 8px;
            }
            .detail-value {
                font-size: 1rem;
            }
            .detail-label {
                font-size: 0.7rem;
            }
            .modal-overlay {
                padding: 10px;
            }
            .modal {
                max-height: 85vh;
            }
            .modal-header {
                padding: 15px;
            }
            .modal-body {
                padding: 15px;
            }
            .modal-grid {
                gap: 10px;
            }
            .modal-route {
                padding: 12px;
                gap: 10px;
            }
            .modal-route-code {
                font-size: 1.1rem;
            }
            .modal-mini-map {
                height: 150px;
            }
            .view-toggle {
                gap: 6px;
            }
            .view-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            #map-container {
                height: 60vh;
                min-height: 300px;
                border-radius: 12px;
            }
            .weather-card {
                padding: 12px 15px;
            }
            .weather-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .weather-value {
                font-size: 1.1rem;
            }
        }

        /* Extra small screens */
        @media (max-width: 380px) {
            .stats {
                gap: 12px;
            }
            .stat-value {
                font-size: 1.5rem;
            }
            .filter-btn, .type-btn {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <h1 id="page-title">SFO Widebody Arrivals</h1>
    <p class="subtitle">Live schedule from FlightRadar24 <span id="status-indicator" class="status-indicator offline">OFFLINE</span></p>

    <div class="airport-selector">
        <button class="airport-btn active" data-airport="SFO">SFO</button>
        <button class="airport-btn" data-airport="LAX">LAX</button>
        <button class="airport-btn" data-airport="JFK">JFK</button>
        <button class="airport-btn" data-airport="EWR">EWR</button>
        <button class="airport-btn" data-airport="DFW">DFW</button>
        <button class="airport-btn" data-airport="SAN">SAN</button>
        <input type="text" id="custom-airport" class="custom-airport-input" placeholder="Other..." maxlength="4">
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="total-count">-</div>
            <div class="stat-label" id="stat-label-total">Widebodies Today</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="airborne-count">-</div>
            <div class="stat-label">In the Air</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="next-eta">-</div>
            <div class="stat-label">Next Arrival</div>
        </div>
    </div>

    <div id="weather-card" class="weather-card">
        <div class="weather-header">
            <span class="weather-icon" id="weather-icon">-</span>
            <span class="weather-title">Spotting Conditions</span>
            <span class="weather-description" id="weather-description">-</span>
        </div>
        <div class="weather-grid">
            <div class="weather-item">
                <div class="weather-value" id="weather-temp">-</div>
                <div class="weather-label">Temp</div>
            </div>
            <div class="weather-item">
                <div class="weather-value" id="weather-visibility">-</div>
                <div class="weather-label">Visibility</div>
            </div>
            <div class="weather-item">
                <div class="weather-value" id="weather-clouds">-</div>
                <div class="weather-label">Cloud Cover</div>
            </div>
            <div class="weather-item">
                <div class="weather-value" id="weather-wind">-</div>
                <div class="weather-label">Wind</div>
            </div>
        </div>
    </div>

    <div class="filters">
        <div class="filter-group">
            <button class="type-btn active" data-type="widebody">Widebodies</button>
            <button class="type-btn" data-type="all">All Aircraft</button>
        </div>
        <div class="filter-separator"></div>
        <div class="filter-group">
            <button class="filter-btn active" data-filter="upcoming">Upcoming</button>
            <button class="filter-btn" data-filter="landed">Recently Landed</button>
            <button class="filter-btn" data-filter="all">All</button>
        </div>
    </div>

    <p class="refresh-info">Last updated: <span id="last-update">-</span> | Next refresh in <span id="countdown">--</span>s</p>

    <div class="view-toggle">
        <button class="view-btn active" data-view="list">List View</button>
        <button class="view-btn" data-view="map">Map View</button>
    </div>

    <div id="map-container"></div>

    <div id="flights-container" class="flights-grid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading flight schedule...</p>
        </div>
    </div>

    <!-- Flight Details Modal -->
    <div id="flight-modal" class="modal-overlay" onclick="closeFlightModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title" id="modal-flight-number">-</span>
                <button class="modal-close" onclick="closeFlightModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <p>Loading flight details...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="app.js"></script>
</body>
</html>
