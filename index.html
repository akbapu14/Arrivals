<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFO Widebody Arrivals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .filter-btn.active {
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            border-color: transparent;
            color: #fff;
            font-weight: 600;
        }
        .airport-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .airport-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .airport-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        .airport-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-color: transparent;
            color: #fff;
        }
        .custom-airport-input {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 90px;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.2s;
        }
        .custom-airport-input::placeholder {
            color: #666;
            text-transform: none;
        }
        .custom-airport-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.12);
        }
        .custom-airport-input.active {
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-color: transparent;
        }
        .flights-grid.loading-state {
            opacity: 0.5;
            pointer-events: none;
        }
        .altitude {
            color: #22c55e;
        }
        .refresh-info {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        .flights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .flight-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .flight-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
        }
        .flight-card.live {
            border-color: rgba(34, 197, 94, 0.8);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        .flight-card.landed {
            opacity: 0.6;
        }
        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .flight-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .aircraft-type {
            background: linear-gradient(90deg, #7c3aed, #00d4ff);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .flight-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .detail {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .eta { color: #f472b6; }
        .origin { color: #a78bfa; }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .status-green { background: #22c55e; color: #000; }
        .status-yellow { background: #facc15; color: #000; }
        .status-red { background: #ef4444; color: #fff; }
        .status-gray { background: rgba(255,255,255,0.2); color: #888; }
        .no-flights {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }
        .loading {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1 id="page-title">SFO Widebody Arrivals</h1>
    <p class="subtitle">Live schedule from FlightRadar24</p>

    <div class="airport-selector">
        <button class="airport-btn active" data-airport="SFO">SFO</button>
        <button class="airport-btn" data-airport="LAX">LAX</button>
        <button class="airport-btn" data-airport="JFK">JFK</button>
        <button class="airport-btn" data-airport="EWR">EWR</button>
        <button class="airport-btn" data-airport="DFW">DFW</button>
        <button class="airport-btn" data-airport="SAN">SAN</button>
        <input type="text" id="custom-airport" class="custom-airport-input" placeholder="Other..." maxlength="4">
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="total-count">-</div>
            <div class="stat-label">Widebodies Today</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="airborne-count">-</div>
            <div class="stat-label">In the Air</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="next-eta">-</div>
            <div class="stat-label">Next Arrival</div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="upcoming">Upcoming</button>
        <button class="filter-btn" data-filter="airborne">Airborne Now</button>
        <button class="filter-btn" data-filter="landed">Recently Landed</button>
        <button class="filter-btn" data-filter="all">All</button>
    </div>

    <p class="refresh-info">Last updated: <span id="last-update">-</span> | Next refresh in <span id="countdown">--</span>s</p>

    <div id="flights-container" class="flights-grid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading flight schedule...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
